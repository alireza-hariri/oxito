[package]
name = "oxito"
version = "0.2.1"
edition = "2021"
description = "Pick running apps and route them through the VPN via sing-box process_path rules"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
rusqlite = "0.32"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
resvg = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
winit = { version = "0.30", default-features = false, features = ["x11"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
