[package]
name = "proxy2vpn"
version = "0.2.0"
edition = "2021"
description = "Pick running apps and route them through the VPN via sing-box process_path rules"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
rusqlite = "0.32"

[profile.release]
opt-level = 3
strip = true
