<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The off (blue) colours; src/icon.rs swaps them for green while sing-box runs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a90e2"/>
      <stop offset="1" stop-color="#2a5fae"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- traffic coming in, entering the tunnel -->
  <path d="M9 32H17" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  <!-- the shield: the VPN -->
  <path d="M33 10L50 16.5V30.5C50 41.5 43 49.5 33 54C23 49.5 16 41.5 16 30.5V16.5Z" fill="#ffffff"/>
  <!-- the route through it -->
  <path d="M24 32H41M35 25.5L41.5 32L35 38.5" fill="none" stroke="#2a5fae" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
