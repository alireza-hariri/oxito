name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: tar cJf "oxito-linux-$(uname -m).tar.xz" -C target/release oxito   # e.g. oxito-linux-x86_64.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: oxito-linux-${{ runner.arch }}
          path: oxito-linux-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oxito-linux-X64
      - uses: softprops/action-gh-release@v2
        with:
          files: oxito-linux-*
